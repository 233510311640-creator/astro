[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-assistant"
version = "0.10.13a3"
description = "Permission-controlled local Windows assistant with verified task execution"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
local-capability-broker = "local_assistant.broker_mcp:main"
local-capability-broker-admin = "local_assistant.broker_admin:main"
local-inventory-admin = "local_assistant.inventory_admin:main"
local-organization-admin = "local_assistant.organization_admin:main"
cypher-model-benchmark = "local_assistant.model_benchmark:main"
cypher-operator-admin = "local_assistant.operator_admin:main"
cypher-windows-admin = "local_assistant.windows_admin:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
